<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pinch-zoom stays on: this is also the public website, and people zoom into
         dense tables. iOS's zoom into a focused field is stopped in index.css
         instead, by giving every field at least 16px text on a touch screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Gridiron — NFL reference</title>
    <meta name="description" content="Every NFL player, team, game and season since 1999, with modern analytics and honest coverage." />
    <script>
      // Applied before first paint so a dark-mode visitor never sees a white
      // flash. No attribute means "follow the system", which is what the CSS
      // expects, so an unset or invalid preference is simply left alone.
      (function () {
        try {
          var t = localStorage.getItem('gridiron.theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
          var d = localStorage.getItem('gridiron.density')
          document.documentElement.setAttribute('data-density', d || 'compact')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
